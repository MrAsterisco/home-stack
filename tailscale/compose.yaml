name: tailscale

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: home-subnet-router
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: home-subnet-router
      TS_ROUTES: ${TS_ROUTES}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale_state:/var/lib/tailscale

volumes:
  tailscale_state:
