services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    volumes:
      - Immich:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    networks:
      - traefik_default
      - immich_backend
    depends_on:
      - redis
      - database
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.photos.rule=Host(`${DOMAIN_NAME}`)
      - traefik.http.routers.photos.entrypoints=websecure
      - traefik.http.routers.photos.tls=true
      - traefik.http.services.photos.loadbalancer.server.port=2283
      - homepage.group=Media
      - homepage.name=Immich
      - homepage.href=https://${DOMAIN_NAME}
      - homepage.description=Photos Backup Server

  redis:
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data:size=64m
    networks:
      - immich_backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich_backend

volumes:
  Immich:
    external: true
  immich_postgres:
    external: true
    name: immich_immich_postgres
  model-cache:

networks:
  traefik_default:
    external: true
    name: traefik_default
  immich_backend:
    driver: bridge
